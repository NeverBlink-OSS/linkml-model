name: Build and test linkml-model

env:
  UV_VERSION: "0.7.13"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Check pyproject.toml and uv.lock
        run: uv lock --check
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    needs: quality-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure tags if not run from main repo
        if: github.repository != 'linkml/linkml-model'
        run: |
          git remote add upstream https://github.com/linkml/linkml-model
          git fetch upstream --tags
      - name: Validate the metamodel using LinkML-Scala
        uses: NeverBlink-OSS/linkml-scala-action@v0.17.1
        with:
          working-directory: linkml_model/model/schema
          files: "*.yaml"
          import-map: "import_map.json"
          strict: true
